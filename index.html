
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show&Trip: Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="PapelLoginCadastro">

        <div class="cardInfo">

            <div class="Icon"></div>

            <h1>Bem-vindo(a)!</h1>

            <p>
                Acesse eventos, resgate benefícios
                <br>
                e explore o melhor da cidade.
            </p>

            <form id="formLogin">


                <div class="campo">
                    <span class="iconeE"></span>
                    <input type="email" placeholder="E-mail" required id="email">
                </div>

                <div class="campo">
                    <input type="password" placeholder="Senha" required id="senha">

                    <img src="img/EyeOn.png" alt="Mostrar senha" class="VerSenha">
                </div>  


            </form>

            <div class="checkbox">
                <input type="checkbox" id="lembrar">
                <label for="lembrar">
                    Li e aceito os <span>Termos de Uso e a Política de Privacidade</span>
                </label>
            </div>   

            <br>

            <button class="btn-entrar" type="submit" form="formLogin" id="BtnEntrar">
                Entrar
            </button>

            <p> ou </p>

            <button class="btn-cadastrar" type="button">
                <img src="img/google.png" alt="Google" class="icone">
                Entrar com o Google
            </button>

            <p>Não tem conta? <a href="cadastro.html">Fazer cadastro</a></p>
        </div>

        <img src="img/logo.png" alt="Logo" class="logo">

    </div>

    

    <script src="script.js"></script>

</body>
</html>
